[package]
name = "neboto"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "A fast, keyboard-driven, read-only terminal UI for browsing AWS"
repository = "https://github.com/neboto/neboto-tui"
homepage = "https://neboto.dev"
readme = "README.md"
keywords = ["aws", "tui", "terminal", "ratatui", "cloud"]
categories = ["command-line-utilities"]

# `cargo binstall neboto` pulls the prebuilt tarball the Release workflow
# attaches to each tag. The archive name must match what
# .github/workflows/release.yml produces and install.sh downloads.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# AWS SDK
# Every aws-sdk-* crate takes its default features minus `rustls`, which only
# adds the SDK's *legacy* connector (rustls 0.21 / hyper 0.14 / h2 0.3) — never
# used to send a request, but compiled in and flagged by `cargo audit` (#145).
# The default client is `default-https-client` (rustls 0.23 / hyper 1). A new
# SDK crate goes in the same way; `cargo tree -i rustls@0.21.12` should stay
# empty. aws-config's defaults don't include the legacy stack, so it keeps them
# (they carry `sso` and `credentials-process`, which fail at runtime if lost).
aws-config = "1.1"
aws-credential-types = "1.1"
aws-sdk-ec2 = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecr = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-rds = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecs = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudtrail = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.17", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-ssoadmin = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-identitystore = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudformation = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-route53 = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-acm = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"

# Fuzzy search
fuzzy-matcher = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization + config
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps detail/export JSON keys in on-screen order instead of
# alphabetizing them (sections and fields read top-to-bottom like the pane).
serde_json = { version = "1.0", features = ["preserve_order"] }
# Demo mode encodes CloudWatch fixtures as CBOR (RPC v2); already in the
# tree through aws-smithy-cbor.
minicbor = { version = "2.2", features = ["alloc"] }
toml = "1.1"

# Clipboard
arboard = "3.3"

# Temporary files
tempfile = "3.8"

# HTTP download (Lambda deployment packages from presigned URLs) + unzip
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Gzip-compressed EC2 user data (Terraform cloudinit_config's default). Already
# in the tree via zip's deflate feature.
flate2 = "1"

# For number formatting
thousands = "0.2"
# Display-width padding for the detail pane key column (CJK / emoji / glyphs)
unicode-width = "0.2"
aws-sdk-cloudwatch = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.17", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-organizations = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-elasticloadbalancingv2 = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-autoscaling = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-computeoptimizer = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.17", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-costexplorer = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Date math for billing periods
chrono = { version = "0.4", default-features = false, features = ["clock"] }
aws-sdk-cloudfront = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-wafv2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-support = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-trustedadvisor = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-directconnect = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-globalaccelerator = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-apigateway = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-apigatewayv2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-servicequotas = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eks = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-efs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eventbridge = { version = "1.109.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sdk-guardduty = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-securityhub = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cognitoidentityprovider = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
