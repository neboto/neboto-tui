aws-sdk-oam = { version = "1.111.0", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Dev builds carry full DWARF debuginfo by default (`debug = 2`). With 60+
# machine-generated `aws-sdk-*` crates, that debuginfo — which we never step into
# — dominates `target/` (easily half of it). Keep line tables for our own code
# (panic backtraces still name our functions) and strip debuginfo from every
# dependency. Cuts `target/` substantially with no practical downside.
[lints.clippy]
# Renderers take (app, area, frame) plus the pane's own data; a struct per
# call site would only rename the parameters.
too_many_arguments = "allow"
# The flagged types are row/series tuples used at one site each; an alias
# would just move the same type a screen away.
type_complexity = "allow"
# Detail-row builders are sequences of `rows.push(…)`. Rewriting only the
# ones whose first push happens to be unconditional would make three of
# hundreds read differently.
vec_init_then_push = "allow"

[profile.dev]
debug = "line-tables-only"

# Release binaries: the symbol table alone is ~120 MB on top of ~135 MB of
# code (80 SDK crates), so strip it — measured 256 MB → 139 MB on
# aarch64-apple-darwin with no runtime change. LTO / opt-level tweaks would
# shave more but cost CI minutes; see docs/RELEASING.md before changing.
[profile.release]
strip = true

[profile.dev.package."*"]
debug = false
