aws-sdk-sesv2 = { version = "1", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sdk-kafka = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-batch = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-xray = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-databasemigration = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-elasticbeanstalk = { version = "1.114", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-scheduler = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-pipes = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
