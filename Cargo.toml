[package]
name = "neboto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A fast, keyboard-driven, read-only terminal UI for browsing AWS"
repository = "https://github.com/neboto/neboto-tui"
readme = "README.md"
keywords = ["aws", "tui", "terminal", "ratatui", "cloud"]
categories = ["command-line-utilities"]

# `cargo binstall neboto` pulls the prebuilt tarball the Release workflow
# attaches to each tag. The archive name must match what
# .github/workflows/release.yml produces and install.sh downloads.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
# TUI
ratatui = "0.26"
crossterm = "0.27"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# AWS SDK
aws-config = "1.1"
aws-credential-types = "1.1"
aws-sdk-ec2 = "1.17"
aws-sdk-ecr = "1.17"
aws-sdk-rds = "1.17"
aws-sdk-ecs = "1.17"
aws-sdk-cloudtrail = "1.17"
aws-sdk-s3 = "1.17"
aws-sdk-ssoadmin = "1.17"
aws-sdk-identitystore = "1.17"
aws-sdk-cloudformation = "1.17"
aws-sdk-lambda = "1.17"
aws-sdk-route53 = "1.17"
aws-sdk-acm = "1.17"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"

# Fuzzy search
fuzzy-matcher = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization + config
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps detail/export JSON keys in on-screen order instead of
# alphabetizing them (sections and fields read top-to-bottom like the pane).
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

# Clipboard
arboard = "3.3"

# Temporary files
tempfile = "3.8"

# HTTP download (Lambda deployment packages from presigned URLs) + unzip
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# For number formatting
thousands = "0.2"
# Display-width padding for the detail pane key column (CJK / emoji / glyphs)
unicode-width = "0.1"
aws-sdk-cloudwatch = "1.17"
aws-sdk-cloudwatchlogs = "1.17"
aws-sdk-sts = "1.17"
aws-sdk-iam = "1.17"
aws-sdk-organizations = "1.17"
aws-sdk-elasticloadbalancingv2 = "1.17"
aws-sdk-autoscaling = "1.17"
aws-sdk-computeoptimizer = "1.17"
aws-sdk-sqs = "1.17"
aws-sdk-sns = "1.17"
aws-sdk-secretsmanager = "1.17"
aws-sdk-ssm = "1.17"
aws-sdk-costexplorer = "1"

# Date math for billing periods
chrono = { version = "0.4", default-features = false, features = ["clock"] }
aws-sdk-cloudfront = "1"
aws-sdk-kms = "1"
aws-sdk-config = "1"
aws-sdk-wafv2 = "1"
aws-sdk-support = "1"
aws-sdk-trustedadvisor = "1"
aws-sdk-directconnect = "1"
aws-sdk-globalaccelerator = "1"
aws-sdk-apigateway = "1"
aws-sdk-apigatewayv2 = "1"
aws-sdk-servicequotas = "1"
aws-sdk-dynamodb = "1"
aws-sdk-eks = "1"
aws-sdk-efs = "1"
aws-sdk-eventbridge = "1.109.0"
aws-sdk-guardduty = "1"
aws-sdk-securityhub = "1"
aws-sdk-cognitoidentityprovider = "1"
aws-sdk-cognitoidentity = "1"
aws-sdk-inspector2 = "1"
aws-sdk-backup = "1"
aws-sdk-networkfirewall = "1"
aws-sdk-sfn = "1"
aws-sdk-codecommit = "1"
aws-sdk-codebuild = "1"
aws-sdk-codepipeline = "1"
aws-sdk-codedeploy = "1"
aws-sdk-codeartifact = "1"
aws-sdk-fsx = "1"
aws-sdk-health = "1"
aws-sdk-resourceexplorer2 = "1"
aws-sdk-resourcegroups = "1"
aws-sdk-transfer = "1"
aws-sdk-route53resolver = "1"
aws-sdk-route53profiles = "1"
aws-sdk-ram = "1"
aws-sdk-workspaces = "1"
aws-sdk-accessanalyzer = "1"
aws-sdk-elasticache = "1"
aws-sdk-opensearch = "1"
aws-sdk-kinesis = "1"
aws-sdk-firehose = "1"
aws-sdk-bedrock = "1"
aws-sdk-bedrockagent = "1"
aws-sdk-bedrockagentcorecontrol = "1"
aws-sdk-bedrockagentcore = "1"
clap = { version = "4.6.1", features = ["derive"] }
aws-sdk-pi = "1"
aws-sdk-athena = "1"
aws-sdk-glue = "1"
aws-sdk-sesv2 = "1"
aws-sdk-kafka = "1"
aws-sdk-scheduler = "1"
aws-sdk-pipes = "1"
aws-sdk-fms = "1"
aws-sdk-redshift = "1"
aws-sdk-redshiftserverless = "1"
aws-sdk-budgets = "1"
aws-sdk-invoicing = "1"
aws-sdk-controltower = "1"
aws-sdk-controlcatalog = "1"
aws-sdk-servicecatalog = "1"
aws-sdk-s3files = "1"
aws-sdk-s3tables = "1.62.0"
similar = "2"
aws-sdk-oam = "1.111.0"

# Dev builds carry full DWARF debuginfo by default (`debug = 2`). With 60+
# machine-generated `aws-sdk-*` crates, that debuginfo — which we never step into
# — dominates `target/` (easily half of it). Keep line tables for our own code
# (panic backtraces still name our functions) and strip debuginfo from every
# dependency. Cuts `target/` substantially with no practical downside.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
