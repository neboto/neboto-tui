aws-sdk-backup = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-networkfirewall = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sfn = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-codecommit = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
