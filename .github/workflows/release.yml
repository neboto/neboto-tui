# Release: build prebuilt binaries for every supported target and attach them
# to a GitHub Release.
#
# Trigger by pushing a version tag that matches Cargo.toml:
#
#   cargo set-version 0.2.0      # or edit Cargo.toml by hand
#   git commit -am "Release v0.2.0"
#   git tag v0.2.0 && git push origin main v0.2.0
#
# The release is created as a DRAFT, every target uploads into it, and the
# final `publish` job flips it live only when all builds succeeded — so a
# half-built release is never visible. While the repo is private, releases are
# visible only to collaborators; nothing else changes when it goes public.
#
# `workflow_dispatch` runs the whole build matrix as a DRY RUN (no release, no
# uploads; archives land as workflow artifacts) so a new target or toolchain
# can be checked without burning a tag.
#
# Repository variables (Settings → Secrets and variables → Actions):
#   RELEASE_ON_CI=false  every job stands down on a tag push; cut the release
#                        from a workstation with scripts/release-local.sh
#                        (zero Actions minutes — the private-repo default).
#   BUILD_MACOS=false    Linux legs run here, macOS legs come from a Mac via
#                        the same script.
#
# Secret:
#   HOMEBREW_TAP_TOKEN   lets the `homebrew` job push the new formula to
#                        neboto/homebrew-tap. Unset: the job checks the
#                        formula and warns instead of pushing.
#
# See docs/RELEASING.md for the runbook.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  create-release:
    name: create draft release
    if: github.event_name == 'push' && vars.RELEASE_ON_CI != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes $prerelease

  build:
    name: build ${{ matrix.target }}
    needs: [create-release]
    # Run after the draft exists, or standalone on a workflow_dispatch dry run
    # (where create-release is skipped). Stand down entirely on a tag push when
    # releases are cut locally.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && (github.event_name == 'workflow_dispatch' || vars.RELEASE_ON_CI != 'false') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write       # upload assets to the draft release
      id-token: write       # OIDC identity for Sigstore keyless signing
      attestations: write   # store the provenance attestation on GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04          # oldest glibc GitHub still hosts → widest compatibility
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            build-tool: cross         # docker-based cross toolchain (needs a C compiler for aws-lc-sys / ring)
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15              # cross-compiled from Apple Silicon; Intel runners are retired
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: matrix.build-tool == 'cross'
        with:
          tool: cross

      # Builds `neboto` in release mode for the target, packs it (with the
      # listed files) into neboto-<target>.tar.gz, writes neboto-<target>.sha256
      # (sha256sum format, one line per asset), and uploads both to the draft
      # release. The names are what install.sh and cargo-binstall expect —
      # change all three together.
      #
      # macOS minutes bill at 10x on a private repo; set the repository
      # variable BUILD_MACOS=false to skip the two macOS legs here and build
      # them locally with scripts/release-local.sh instead (docs/RELEASING.md).
      - name: Build and upload
        id: build
        if: ${{ !startsWith(matrix.os, 'macos') || vars.BUILD_MACOS != 'false' }}
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: neboto
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool || 'cargo' }}
          locked: true
          tar: unix
          zip: none
          include: README.md,LICENSE,PERMISSIONS.md,config.example.toml
          checksum: sha256
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          dry-run-intended: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Signed statement that this exact archive was built by this workflow,
      # from this commit, on a GitHub-hosted runner (Sigstore keyless signing,
      # recorded in the public transparency log, stored on GitHub). A swapped
      # archive fails verification even if its .sha256 was swapped with it —
      # both are uploaded by the same token, so the checksum alone can't tell.
      # Verify a download with:
      #   gh attestation verify neboto-<target>.tar.gz --repo neboto/neboto-tui
      # Runs on dry runs too so a workflow_dispatch exercises the plumbing;
      # those attestations name artifacts that were never published, which is
      # harmless.
      - name: Attest build provenance
        if: steps.build.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.tar }}

      - name: Keep the archive + checksum as a workflow artifact (dry run only)
        if: github.event_name == 'workflow_dispatch' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neboto-${{ matrix.target }}
          path: |
            neboto-${{ matrix.target }}.tar.gz
            neboto-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: [create-release, build]
    if: github.event_name == 'push' && vars.RELEASE_ON_CI != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Flip the draft live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  # Points `brew install neboto/tap/neboto` at the release just published:
  # generates Formula/neboto.rb from the release's .sha256 assets, proves it
  # audits, installs and passes its test on a real Mac, then pushes it to
  # neboto/homebrew-tap. Stable tags only. The push needs the
  # HOMEBREW_TAP_TOKEN secret (contents: write on neboto/homebrew-tap only —
  # this workflow's own token can't push to another repo); without it the
  # formula is still checked and the job warns instead of pushing.
  # Runs after `publish`, so a failure here never holds a release back — fix
  # the tap by hand with scripts/homebrew-formula.sh (docs/RELEASING.md).
  homebrew:
    name: update homebrew tap
    needs: [publish]
    if: github.event_name == 'push' && vars.RELEASE_ON_CI != 'false' && !contains(github.ref_name, '-')
    runs-on: macos-15
    permissions:
      contents: read
      attestations: read    # gh attestation verify
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The formula pins whatever the .sha256 assets say, and an archive and
      # its checksum are uploaded by the same token, so a swapped pair would
      # pin a bad archive for every brew user. Check each archive's build
      # provenance and checksum first, as install.sh does.
      - name: Verify the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'neboto-*.tar.gz' --pattern 'neboto-*.sha256' --dir assets
          cd assets
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            shasum -a 256 -c "neboto-$t.sha256"
            gh attestation verify "neboto-$t.tar.gz" --repo "$GITHUB_REPOSITORY"
          done

      - name: Generate the formula
        run: |
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" assets > neboto.rb
          cat neboto.rb

      # Formulae load only from a tap, so the check uses a throwaway local
      # one. Homebrew 7 refuses to load formulae from an untrusted tap;
      # `brew trust` doesn't exist before 7, where nothing needs trusting.
      - name: Audit, install and test it
        run: |
          brew tap-new --no-git neboto-ci/check
          cp neboto.rb "$(brew --repository neboto-ci/check)/Formula/neboto.rb"
          brew trust neboto-ci/check || true
          brew audit --strict --online neboto-ci/check/neboto
          brew install neboto-ci/check/neboto
          brew test neboto-ci/check/neboto

      - name: Check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so neboto/homebrew-tap was not updated. The checked formula is in this job's log."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: neboto/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push the formula to the tap
        if: steps.token.outputs.present == 'true'
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../neboto.rb Formula/neboto.rb
          git add Formula/neboto.rb
          if git diff --cached --quiet; then
            echo "Formula/neboto.rb is already at $GITHUB_REF_NAME"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "neboto ${GITHUB_REF_NAME#v}" \
                     -m "From $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          git push
