# Release: build prebuilt binaries for every supported target and attach them
# to a GitHub Release.
#
# Trigger by pushing a version tag that matches Cargo.toml:
#
#   cargo set-version 0.2.0      # or edit Cargo.toml by hand
#   git commit -am "Release v0.2.0"
#   git tag v0.2.0 && git push origin main v0.2.0
#
# The release is created as a DRAFT, every target uploads into it, and the
# final `publish` job flips it live only when all builds succeeded — so a
# half-built release is never visible. While the repo is private, releases are
# visible only to collaborators; nothing else changes when it goes public.
#
# `workflow_dispatch` runs the whole build matrix as a DRY RUN (no release, no
# uploads; archives land as workflow artifacts) so a new target or toolchain
# can be checked without burning a tag.
#
# Repository variables (Settings → Secrets and variables → Actions):
#   RELEASE_ON_CI=false  every job stands down on a tag push; cut the release
#                        from a workstation with scripts/release-local.sh
#                        (zero Actions minutes — the private-repo default).
#   BUILD_MACOS=false    Linux legs run here, macOS legs come from a Mac via
#                        the same script.
#
# See docs/RELEASING.md for the runbook.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  create-release:
    name: create draft release
    if: github.event_name == 'push' && vars.RELEASE_ON_CI != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes $prerelease

  build:
    name: build ${{ matrix.target }}
    needs: [create-release]
    # Run after the draft exists, or standalone on a workflow_dispatch dry run
    # (where create-release is skipped). Stand down entirely on a tag push when
    # releases are cut locally.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && (github.event_name == 'workflow_dispatch' || vars.RELEASE_ON_CI != 'false') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write       # upload assets to the draft release
      id-token: write       # OIDC identity for Sigstore keyless signing
      attestations: write   # store the provenance attestation on GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04          # oldest glibc GitHub still hosts → widest compatibility
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            build-tool: cross         # docker-based cross toolchain (needs a C compiler for aws-lc-sys / ring)
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15              # cross-compiled from Apple Silicon; Intel runners are retired
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        if: matrix.build-tool == 'cross'
        with:
          tool: cross

      # Builds `neboto` in release mode for the target, packs it (with the
      # listed files) into neboto-<target>.tar.gz, writes neboto-<target>.sha256
      # (sha256sum format, one line per asset), and uploads both to the draft
      # release. The names are what install.sh and cargo-binstall expect —
      # change all three together.
      #
      # macOS minutes bill at 10x on a private repo; set the repository
      # variable BUILD_MACOS=false to skip the two macOS legs here and build
      # them locally with scripts/release-local.sh instead (docs/RELEASING.md).
      - name: Build and upload
        id: build
        if: ${{ !startsWith(matrix.os, 'macos') || vars.BUILD_MACOS != 'false' }}
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: neboto
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool || 'cargo' }}
          locked: true
          tar: unix
          zip: none
          include: README.md,LICENSE,PERMISSIONS.md,config.example.toml
          checksum: sha256
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          dry-run-intended: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Signed statement that this exact archive was built by this workflow,
      # from this commit, on a GitHub-hosted runner (Sigstore keyless signing,
      # recorded in the public transparency log, stored on GitHub). A swapped
      # archive fails verification even if its .sha256 was swapped with it —
      # both are uploaded by the same token, so the checksum alone can't tell.
      # Verify a download with:
      #   gh attestation verify neboto-<target>.tar.gz --repo neboto/neboto-tui
      # Runs on dry runs too so a workflow_dispatch exercises the plumbing;
      # those attestations name artifacts that were never published, which is
      # harmless.
      - name: Attest build provenance
        if: steps.build.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.tar }}

      - name: Keep the archive + checksum as a workflow artifact (dry run only)
        if: github.event_name == 'workflow_dispatch' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neboto-${{ matrix.target }}
          path: |
            neboto-${{ matrix.target }}.tar.gz
            neboto-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: [create-release, build]
    if: github.event_name == 'push' && vars.RELEASE_ON_CI != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Flip the draft live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
